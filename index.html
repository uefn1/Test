A static, GitHub Pages-ready site for searching \`iptv-org/iptv\` Issues and bulk exporting results.

## Features
- Searches via GitHub Search API: \`repo:iptv-org/iptv\`
- No raw stream URLs displayed (masked as [URL REDACTED])
- Bulk download as JSON / CSV
- Optional Personal Access Token (in-memory only, never stored) for higher rate limits

## How to deploy to GitHub Pages

1. Create a new repository (e.g., \`iptv-search-tool\`)
2. Put this single file as \`index.html\` at repo root
   - Or build from this React source and output to \`docs/\` or root
3. Commit & push:
   \`\`\`bash
   git add index.html
   git commit -m "Add issue search tool"
   git push origin main
   \`\`\`
4. Go to repository Settings > Pages
   - Source: Deploy from a branch
   - Branch: main / (root)  OR  main /docs if you used docs folder
5. Save. Your site will be live at https://<username>.github.io/<repo>/

### Token (optional)
If you hit rate limits (60 req/hour unauthenticated):
- GitHub > Settings > Developer settings > Personal access tokens > Fine-grained or Classic (no scopes needed for public read)
- Paste token into the tool. It stays only in memory for this session and is sent only to api.github.com.

### Local development
Just open \`index.html\` via a local server:
\`\`\`bash
npx serve .
# or
python -m http.server 8000
\`\`\`

No build step required. All logic is client-side.

## Privacy
- No backend. All fetches go directly to api.github.com
- Issue bodies are masked - URLs replaced with [URL REDACTED]
- Preview limited to 120 chars
